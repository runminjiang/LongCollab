[project]
name = "team-memory-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7", "pydantic>=2.9,<3", "litellm==1.105.7"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
benchmarks = [
    "requests>=2.32.5,<3",
    "openai==2.54.0", "together==1.5.26",
    "arxiv==4.1.0", "semanticscholar==0.12.0", "keybert==0.9.0",
    "sentence-transformers==3.4.1", "transformers==4.52.4", "torch==2.9.1",
    "datasets==4.8.5", "multiprocess==0.70.19", "dill==0.4.1",
    "python-Levenshtein>=0.25", "PyPDF2==3.0.1", "PyMuPDF==2.1",
    "psycopg2-binary>=2.9", "pandas==2.3.3", "openpyxl==3.1.5",
    "omegaconf>=2.3", "colorlog>=6", "beautifulsoup4>=4.12", "python-dotenv>=1",
]

[tool.setuptools.packages.find]
include = ["runtime*", "service*", "tools*", "scenarios*", "eval*"]

[tool.setuptools.package-data]
"tools.visualization" = ["*.html", "*.css", "*.js", "*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
